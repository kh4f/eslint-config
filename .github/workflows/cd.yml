name: cd

on:
  push:
    tags: v*.*.*

jobs:
  cd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2

      - run: bun i
      - run: bun lint
      - run: bun run build

      - run: npm stage publish
      - run: |
          awk '/^## /{found++; next} found==1' CHANGELOG.md |
            gh release create $TAG --title $TAG --draft --notes-file -
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}